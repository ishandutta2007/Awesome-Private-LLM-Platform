<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s infinite alternate ease-in-out;
      transform-origin: center;
    }
    .float-item {
      animation: float 4s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.7; }
      100% { transform: scale(1.03); opacity: 1; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="300" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="300" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="300" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="300" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="300" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="300" class="grid-line" />
    
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="150" x2="1200" y2="150" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1050" cy="220" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="pulse-circle" />

  <!-- Geometric Neural Connections / Nodes -->
  <g opacity="0.6" class="float-item">
    <line x1="820" y1="80" x2="920" y2="140" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="920" y1="140" x2="1040" y2="90" stroke="#a855f7" stroke-width="2" />
    <line x1="920" y1="140" x2="980" y2="220" stroke="#ec4899" stroke-width="2" />
    <line x1="1040" y1="90" x2="1120" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />

    <circle cx="820" cy="80" r="6" fill="#6366f1" />
    <circle cx="920" cy="140" r="8" fill="#a855f7" filter="url(#subtleGlow)" />
    <circle cx="1040" cy="90" r="7" fill="#38bdf8" />
    <circle cx="980" cy="220" r="6" fill="#ec4899" />
    <circle cx="1120" cy="170" r="5" fill="#818cf8" />
  </g>

  <!-- Shield / Lock Graphic Icon -->
  <g transform="translate(80, 75)" class="pulse-circle">
    <!-- Outer Shield -->
    <path d="M 60 10 L 110 35 V 85 C 110 125 60 150 60 150 C 60 150 10 125 10 85 V 35 Z" 
          fill="url(#shieldGradient)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" opacity="0.85" />
    <!-- Inner Lock Icon -->
    <rect x="42" y="72" width="36" height="30" rx="4" fill="#0f172a" stroke="#e2e8f0" stroke-width="2.5" />
    <path d="M 48 72 V 58 C 48 50 72 50 72 58 V 72" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <circle cx="60" cy="85" r="3" fill="#38bdf8" />
  </g>

  <!-- Text Header Section -->
  <g transform="translate(220, 115)">
    <!-- Top Accent Bar -->
    <rect x="0" y="-45" width="180" height="6" rx="3" fill="url(#accentGradient)" filter="url(#subtleGlow)" />

    <!-- Title -->
    <text x="0" y="15" class="title">
      Awesome Private LLM Platform <tspan fill="#a855f7">🔒</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="55" class="subtitle">
      Self-Hosted, Enterprise-Grade &amp; Privacy-First AI Ecosystem
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 90)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="18" cy="16" r="5" fill="#22c55e" />
      <text x="32" y="21" class="badge-text">Open-Source</text>

      <!-- Badge 2 -->
      <rect x="142" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="160" cy="16" r="5" fill="#38bdf8" />
      <text x="174" y="21" class="badge-text">Privacy-First</text>

      <!-- Badge 3 -->
      <rect x="299" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="317" cy="16" r="5" fill="#a855f7" />
      <text x="331" y="21" class="badge-text">Enterprise SaaS</text>
    </g>
  </g>
</svg>
